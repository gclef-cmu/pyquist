name: Publish

# Build the sdist + wheel and publish them to PyPI when a GitHub Release is
# published.
#
# To cut a release: bump `__version__` in pyquist/__init__.py, tag the commit
# with the matching version (e.g. `0.1.0`), and publish a GitHub Release for
# that tag. The build job fails if the tag and __version__ disagree.

on:
  release:
    types: [published]
  # Allow a manual dry-run build (no publish) from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Guard against publishing a version that doesn't match the release tag.
      # The built version comes from the wheel filename (pyquist-<version>-...).
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg_version=$(basename dist/*.whl | cut -d- -f2)
          tag="${{ github.ref_name }}"
          echo "Built version: $pkg_version"
          echo "Release tag:   $tag"
          if [ "$pkg_version" != "$tag" ]; then
            echo "::error::Release tag '$tag' does not match package __version__ '$pkg_version'. Bump pyquist/__init__.py and re-tag."
            exit 1
          fi

      # twine's metadata check mirrors what PyPI validates on upload.
      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Only publish for an actual release; workflow_dispatch just builds above.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyquist
    permissions:
      # Required for Trusted Publishing (OIDC token exchange with PyPI).
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
