name: Publish

# Build the sdist + wheel and publish them to PyPI when a GitHub Release is
# published.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API tokens or
# secrets are stored in the repo. One-time setup on PyPI:
#   1. Create the project (or reserve the name) at https://pypi.org.
#   2. Go to the project's Settings -> Publishing -> "Add a new publisher".
#   3. Fill in:
#        Owner:            gclef-cmu
#        Repository name:  pyquist
#        Workflow name:    publish.yml
#        Environment name: pypi
#   4. In this repo's Settings -> Environments, create an environment named
#      "pypi" (optionally restrict it to release tags / require reviewers).
#
# To cut a release: bump `version` in pyproject.toml, tag the commit
# (e.g. v0.1.0), and publish a GitHub Release for that tag.

on:
  release:
    types: [published]
  # Allow a manual dry-run build (no publish) from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # twine's metadata check mirrors what PyPI validates on upload.
      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Only publish for an actual release; workflow_dispatch just builds above.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyquist
    permissions:
      # Required for Trusted Publishing (OIDC token exchange with PyPI).
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
