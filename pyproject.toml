[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquist"
dynamic = ["version"]
description = "Barebones utilities for low-level computer music programming in Python and NumPy. Teaching library for CMU 15-322."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chris Donahue" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["audio", "music", "dsp", "midi", "numpy", "computer-music", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib",
    "mido",
    "numpy>=2.0",
    "requests",
    "resampy",
    "sounddevice",
    "soundfile",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ruff>=0.8",
]
notebook = [
    "ipython",
]
docs = [
    "sphinx>=7",
    "sphinx-autodoc-typehints>=2",
]

[project.urls]
Homepage = "https://gclef-cmu.org/pyquist"
Documentation = "https://gclef-cmu.org/pyquist"
Repository = "https://github.com/gclef-cmu/pyquist"
Issues = "https://github.com/gclef-cmu/pyquist/issues"

[project.scripts]
pyquist = "pyquist.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pyquist.__version__" }

[tool.setuptools.packages.find]
include = ["pyquist*"]
exclude = ["examples*", "docs*"]

# Ship the bundled audio + MIDI samples (used by the HelloPyquist notebook,
# the README examples, and the test suite). Total ~2 MB.
[tool.setuptools.package-data]
# py.typed: PEP 561 marker so downstream type checkers honor our type hints.
pyquist = ["py.typed", "test_data/*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E203: whitespace before ':' (conflicts with formatter)
# E501: line too long (formatter handles wrapping; soft limit only)
# E731: do not assign a lambda expression
extend-select = ["I"]  # isort
ignore = ["E203", "E501", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["pyquist"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true
